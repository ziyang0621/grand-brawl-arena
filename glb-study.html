<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blender 角色检视</title>
<style>body{margin:0;background:#b9c1c7;color:#17232c;font:14px system-ui}header{position:absolute;top:14px;left:18px;right:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{padding:6px 10px;border:1px solid #65717a;background:#f3f1ea;border-radius:6px;cursor:pointer}button.on{background:#ffd24a}#info{position:absolute;left:18px;bottom:12px}</style>
<header><b>Blender 角色检视</b><span id="clips"></span><label>角色 <select id="who"></select></label><label>角度 <select id="angle"><option value="0">正面</option><option value="0.65" selected>四分之三</option><option value="1.5707963267948966">向右</option><option value="-1.5707963267948966">向左</option><option value="3.141592653589793">背面</option></select></label><button id="auto">自动轮播</button><button id="pause">暂停</button><label>动作进度 <input id="frame" type="range" min="0" max="1" step="0.005" value="0"></label><span>方向键检查转身 · 拖动进度查看挥剑和落脚</span></header><div id="info"></div>
<script type="module">
import * as THREE from './vendor/three.module.js';
import {loadGlbModel,instantiate} from './arena-glb.js';
import {configureTripo} from './arena-tripo.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#b9c1c7');
scene.add(new THREE.HemisphereLight('#fff6e5','#687784',2));const sun=new THREE.DirectionalLight('#fff4df',2.4);sun.position.set(-3,7,5);scene.add(sun);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(30,1,.1,80);
const params=new URLSearchParams(location.search);
const model=await loadGlbModel('models/'+(params.get('m')||'swordsman')+'.glb');
const tripo=params.get('m')==='tripo-pirate',ch=instantiate(model,{preserveMaterials:tripo,ink:tripo?.002:.022});if(tripo)configureTripo(ch);const pivot=new THREE.Group();pivot.add(ch.root);scene.add(pivot);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#a4afb5',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;scene.add(floor);scene.add(new THREE.GridHelper(20,20,'#6c7c85','#92a0a8'));
const who=document.querySelector('#who');for(const [id,n] of [['tripo-pirate','Tripo 剑士'],['swordsman','红帆'],['guardian','蓝潮'],['brawler','铁拳'],['gunner','火哨'],['cook','灶火'],['stormcaller','云雀']]){const o=document.createElement('option');o.value=id;o.textContent=n;who.append(o);}
who.value=params.get('m')||'swordsman';who.onchange=()=>{const u=new URL(location.href);u.searchParams.set('m',who.value);location.href=u.toString();};
const holder=document.querySelector('#clips');
for(const name of Object.keys(ch.actions)){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{auto=false;paused=false;document.querySelector('#pause').textContent='暂停';ch.play(name,{restart:true,loop:true});mark(name);};holder.append(b);}
const mark=n=>[...holder.children].forEach(b=>b.classList.toggle('on',b.textContent===n));
let auto=false,paused=false;document.querySelector('#auto').onclick=()=>{auto=!auto;paused=false;};
const frame=document.querySelector('#frame'),pause=document.querySelector('#pause');
pause.onclick=()=>{paused=!paused;pause.textContent=paused?'播放':'暂停';};
frame.oninput=()=>{auto=false;paused=true;pause.textContent='播放';const name=ch.current.getClip().name;ch.mixer.stopAllAction();ch.play(name,{restart:true,fade:0});ch.current.time=Number(frame.value)*ch.current.getClip().duration;ch.update(0);render();};
const angle=document.querySelector('#angle');
addEventListener('keydown',e=>{const yaw={ArrowLeft:-Math.PI/2,ArrowRight:Math.PI/2,ArrowUp:Math.PI,ArrowDown:0}[e.code];if(yaw!==undefined){e.preventDefault();angle.value=String(yaw);render();}});
const sequence=['idle','walk','run','jump','fall','land','attack_a','attack_b','heavy','dash','shoot','skill','guard','hurt','carry','grab'];let si=0,sTime=0;
ch.play(params.get('clip')||'idle');mark(params.get('clip')||'idle');
window.__glb={ch,THREE,camera,seek(name,t){ch.mixer.stopAllAction();const a=ch.actions[name];a.reset().play();a.time=t;ch.mixer.update(0);},snap(){return renderer.domElement.toDataURL('image/png');},render};
function render(){
  const a=Number(angle.value);pivot.rotation.y=a;
  camera.aspect=innerWidth/innerHeight;const zoom=params.get('zoom');if(zoom){camera.position.set(0,3.4,4.2);camera.lookAt(0,3.1,0);}else{camera.position.set(0,2.9,11.5);camera.lookAt(0,1.85,0);}
  renderer.setSize(innerWidth,innerHeight);camera.updateProjectionMatrix();renderer.render(scene,camera);
  document.querySelector('#info').textContent=`${renderer.info.render.triangles.toLocaleString()} 三角形 · ${renderer.info.render.calls} 次绘制 · 动作：${ch.current?._clip?.name||''}`;
}
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(auto&&!paused){sTime+=dt;if(sTime>1.6){sTime=0;si=(si+1)%sequence.length;ch.play(sequence[si],{loop:true,restart:true});mark(sequence[si]);}}if(!paused){ch.update(dt);frame.value=ch.current.time/ch.current.getClip().duration;}render();});
</script></html>
